name: CD - Build, Push & Deploy

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/doud75/setly-backend
  IMAGE_FRONTEND: ghcr.io/doud75/setly-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta-backend.outputs.version }}

    steps:
      - name: Vérifier que la ref est un tag de version
        run: |
          case "${{ github.ref }}" in
            refs/tags/v*.*.*)
              echo "Déploiement de ${{ github.ref_name }}" ;;
            *)
              echo "::error::Ce workflow doit être lancé sur un tag de version vX.Y.Z (ref reçue : ${{ github.ref }})"
              exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & Push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build & Push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            export IMAGE_TAG='${{ needs.build-and-push.outputs.version }}'

            echo "🚀 [$(date)] Starting deployment of ${{ github.ref_name }} (image tag: $IMAGE_TAG)"
            cd /home/deploy/Setly

            echo "📥 Checking out tag ${{ github.ref_name }} (migrations & compose files)..."
            git fetch --tags --force
            git checkout --force "refs/tags/${{ github.ref_name }}"

            echo "🗄️ Running database migrations..."
            docker compose up --build migrator

            echo "📦 Pulling Docker images ($IMAGE_TAG)..."
            docker compose -f docker-compose.yml -f /home/deploy/Setly/docker-compose.prod.yml pull

            echo "🔄 Restarting services..."
            docker compose -f docker-compose.yml -f /home/deploy/Setly/docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Pruning old images & build cache..."
            docker image prune -af --filter "until=168h"
            docker builder prune -af --filter "until=168h"

            echo "🏥 Checking service health..."
            sleep 10
            docker compose -f docker-compose.yml -f /home/deploy/Setly/docker-compose.prod.yml ps

            echo "✅ [$(date)] Deployment of ${{ github.ref_name }} completed successfully!"
          EOF

      - name: Verify deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            export IMAGE_TAG='${{ needs.build-and-push.outputs.version }}'
            cd /home/deploy/Setly
            echo "--- Recent backend logs ---"
            docker compose -f docker-compose.yml -f /home/deploy/Setly/docker-compose.prod.yml logs backend --tail=20
            echo "--- Recent frontend logs ---"
            docker compose -f docker-compose.yml -f /home/deploy/Setly/docker-compose.prod.yml logs frontend --tail=20
          EOF
