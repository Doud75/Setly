x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    ports:
      - "127.0.0.1:8089:8089"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - VITE_ORIGIN=${VITE_ORIGIN}
    env_file: .env
    networks:
      - app-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  migrator:
    build:
      context: ./backend
      target: builder
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    networks:
      - app-network
    command: ["/bin/sh", "-c", "sleep 5 && /go/bin/migrate -path db/migrations -database $DATABASE_URL up"]

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
